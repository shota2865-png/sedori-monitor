name: sedori-monitor
# GitHub Actions の schedule は高頻度cronを大量に間引く（実測: */10 指定で4〜6時間に1回）。
# 対策として「1回の実行の中で10分おきに5回スキャンし、最後に自分自身を再起動する」連鎖方式にする。
# cron は連鎖が切れたときの保険（1時間ごと）。
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -r requirements.txt

      - name: scan loop (10分おきに5回)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set +e
          for i in 1 2 3 4 5; do
            echo "--- scan $i/5 ---"
            python monitor.py
            git config user.name  "sedori-bot"
            git config user.email "bot@users.noreply.github.com"
            git add state.json
            git diff --cached --quiet || git commit -m "state $(date -u +%m%d-%H%M)"
            git pull --rebase origin main >/dev/null 2>&1 || true
            git push >/dev/null 2>&1 || true
            [ $i -lt 5 ] && sleep 600
          done
          exit 0

      - name: 次の実行を連鎖起動
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/monitor.yml/dispatches" \
            -d '{"ref":"main"}' && echo "chained OK" || echo "chain failed (cronが拾う)"
